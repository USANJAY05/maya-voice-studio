name: Build and publish Docker image

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-frontend
            dockerfile: maya_studio/Dockerfile.mac
            platform: linux/arm64
            suffix: mac-arm64
          - name: linux-amd64
            dockerfile: maya_studio/Dockerfile.linux
            platform: linux/amd64
            suffix: linux-amd64
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo 'Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to repository secrets.' >&2
            exit 1
          fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push platform image
        uses: docker/build-push-action@v7
        with:
          context: ./maya_studio
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/maya-voice-studio:sha-${{ github.sha }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Publish latest platform tag on master
        if: github.ref == 'refs/heads/master'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          COMMIT_SHA: ${{ github.sha }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          image="${DOCKERHUB_USERNAME}/maya-voice-studio"
          docker buildx imagetools create -t "$image:latest-$SUFFIX" "$image:sha-$COMMIT_SHA-$SUFFIX"
