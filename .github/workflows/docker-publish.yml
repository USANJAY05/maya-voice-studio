name: Build and publish Docker image

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac-frontend
            dockerfile: maya_studio/Dockerfile.mac
            platform: linux/arm64
            suffix: mac
          - name: windows-nvidia
            dockerfile: maya_studio/Dockerfile.cuda
            platform: linux/amd64
            suffix: windows
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo 'Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to repository secrets.' >&2
            exit 1
          fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push platform image
        uses: docker/build-push-action@v7
        with:
          context: ./maya_studio
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/maya-voice-studio:sha-${{ github.sha }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  manifest:
    name: Publish multi-platform tag
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Combine platform images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          COMMIT_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          image="${DOCKERHUB_USERNAME}/maya-voice-studio"
          tags=(-t "$image:sha-$COMMIT_SHA")
          if [ "$REF" = 'refs/heads/master' ]; then tags+=(-t "$image:latest"); fi
          docker buildx imagetools create "${tags[@]}" "$image:sha-$COMMIT_SHA-mac" "$image:sha-$COMMIT_SHA-windows"
