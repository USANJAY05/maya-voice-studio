name: Update Docker Hub overview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize README to Docker Hub
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/maya-voice-studio
          readme-filepath: ./README.md
          short-description: Local multilingual text-to-speech with Maya 2 Native.
